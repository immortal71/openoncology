name: CI

on:
  push:
    branches: [main, develop]
  # No base-branch filter on pull_request. With `branches: [main]` a PR opened
  # against another topic branch ran nothing at all: not tests, not lint, not the
  # migration gate. That is the normal shape of a stacked PR, where the second
  # change is based on the first while it is still in review, and it silently got
  # zero coverage from every gate in this file.
  pull_request:

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  lint-frontend:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

  test-frontend:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage
          if-no-files-found: ignore

  e2e-frontend:
    name: Frontend E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (boots app in demo mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  # ── Backend ───────────────────────────────────────────────────────────────
  lint-backend:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint deps
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openoncology
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: openoncology_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: postgresql+asyncpg://openoncology:testpassword@localhost:5432/openoncology_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx sentry-sdk prometheus-fastapi-instrumentator structlog

      - name: Run Alembic migrations
        run: alembic upgrade head

      # Blocking. Checks the chain properties that do not depend on the drift
      # below: exactly one head, exactly one root, no duplicate revision ids, no
      # dangling down_revision. A fork breaks `alembic upgrade head` for every
      # deployment, and the merge that causes it looks clean in review.
      - name: Migration chain gate
        working-directory: ${{ github.workspace }}
        run: python scripts/check_migration_chain.py

      # Blocking. This step carried `continue-on-error: true` and a comment
      # claiming substantial drift in repurposing_candidates, campaigns and
      # submissions. Every table it named was reconciled by a8bf7eb4833c in July
      # 2026; the comment predates that migration and was copied forward twice
      # without being re-read against it. Against a real Postgres this step has
      # been answering "No new upgrade operations detected." while being told its
      # answer did not count.
      #
      # Two real gaps survive, and neither is visible here, which is why turning
      # this on does not close them (both tracked as open action 8):
      #   - 11 columns where 0001 used a bare sa.String and the model specifies a
      #     length. alembic's DefaultImpl._column_args_match does not flag a
      #     reflected type for being less specific than the metadata type, so a
      #     String(128) model field backed by an unbounded VARCHAR reads as a
      #     match. Fixing it means hand-written alter_column calls.
      #   - 19 indexes dropped by a8bf7eb4833c because no model declares
      #     index=True. Chain and models agree, so this step is silent, but the
      #     database lost every FK join-column index.
      - name: Detect uncommitted model changes
        run: alembic check

      # The api/tests and ai/tests suites cannot share one interpreter: both the
      # FastAPI app (api/ai/) and the top-level ai/ package claim the import name
      # `ai`, and a single process can only bind it to one. So they run as two
      # separate pytest invocations, with coverage accumulated via --cov-append
      # and the threshold enforced once at the end. (See pyproject.toml.)
      - name: Run backend tests (api suite)
        working-directory: ${{ github.workspace }}
        run: pytest api/tests/ -v --tb=short --cov=ai --cov=api --cov-report= --cov-fail-under=0
        env:
          PYTHONPATH: ${{ github.workspace }}

      # No --cov-fail-under here: the threshold is declared once in
      # pyproject.toml ([tool.coverage.report] fail_under), which also carries
      # the history of how the measured number changed. This step inherits it.
      - name: Run backend tests (ai suite)
        working-directory: ${{ github.workspace }}
        run: pytest ai/tests/ -v --tb=short --cov=ai --cov=api --cov-append --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-xml
          path: coverage.xml

      - name: Hard clinical benchmark quality gate
        working-directory: ${{ github.workspace }}
        run: python scripts/hard_benchmark_gate.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ── Deployment manifests ──────────────────────────────────────────────────
  # Nothing in this file had ever rendered the Helm chart. The readiness probe
  # in infra/helm/templates/api.yaml pointed at /health, which answers 200
  # unconditionally, while infra/k8s/deployment.yaml used /ready, which
  # round-trips Postgres and Redis. Two manifests for one service, disagreeing,
  # on the path production deploys from — and no job that would notice.
  #
  # api/tests/test_deployment_manifests.py asserts the same properties by
  # parsing, so the suite catches this offline. This job is what catches a chart
  # that no longer renders at all, or renders into invalid Kubernetes.
  validate-manifests:
    name: Deployment manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Helm lint (base values)
        run: helm lint infra/helm --values infra/helm/values.yaml

      - name: Helm lint (production values)
        run: |
          helm lint infra/helm \
            --values infra/helm/values.yaml \
            --values infra/helm/values.production.yaml

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Chart.yaml declares postgresql and redis and neither is vendored, so
      # `helm template` refuses to render anything at all until they are
      # fetched. The first version of this job piped straight into kubeconform,
      # which meant helm's error went to stderr, stdout was empty, kubeconform
      # reported "0 resource found parsing stdin - Valid: 0", and the pipe
      # returned kubeconform's exit code. A job that renders nothing and passes
      # is worse than no job, so the render below writes to a file, runs under
      # pipefail, and has to produce resources before anything is validated.
      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency update infra/helm

      - name: Render and validate the chart against the Kubernetes schema
        shell: bash
        run: |
          set -euo pipefail
          helm template openoncology infra/helm \
            --values infra/helm/values.yaml \
            --values infra/helm/values.production.yaml \
            --api-versions autoscaling/v2 \
            --namespace openoncology > rendered.yaml
          test -s rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 rendered.yaml

      # Schema validity says the YAML is well formed, not that it deploys what
      # it is supposed to. These are the properties this chart got wrong, so
      # they are asserted against the rendered output rather than the templates.
      - name: Assert the rendered chart deploys what it should
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if grep -q -- "$1" rendered.yaml; then
              echo "ok: $2"
            else
              echo "MISSING: $2"; fail=1
            fi
          }
          check 'path: /ready'         'API readiness probe checks its dependencies'
          check 'workers.gdpr_worker'  'a worker consumes the gdpr queue'
          check 'component: beat'      'Celery Beat is deployed'
          check 'KEYCLOAK_AUDIENCE'    'the audience production requires is wired'
          check 'kind: PodDisruptionBudget' 'the API has a disruption budget'
          check 'terminationGracePeriodSeconds' 'shutdown is given a grace period'
          exit $fail

      # NetworkPolicies are off by default, so the render above never sees them.
      # A policy that fails to render, or whose podSelector matches no pod the
      # chart creates, is a policy that silently denies traffic in production.
      - name: Render and check the network policies
        shell: bash
        run: |
          set -euo pipefail
          helm template openoncology infra/helm             --values infra/helm/values.yaml             --values infra/helm/values.production.yaml             --set networkPolicy.enabled=true             --api-versions autoscaling/v2             --namespace openoncology > rendered-netpol.yaml
          test -s rendered-netpol.yaml
          kubeconform -strict -summary -ignore-missing-schemas             -kubernetes-version 1.29.0 rendered-netpol.yaml
          # Inline rather than a helper under scripts/, which is covered by the
          # PreToolUse guard and is not a path to add tooling to casually.
          python3 - rendered-netpol.yaml <<'CHECK'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          policies = [d for d in docs if d.get("kind") == "NetworkPolicy"]
          pods = [d for d in docs if d.get("kind") in ("Deployment", "StatefulSet")]
          cronjobs = [d for d in docs if d.get("kind") == "CronJob"]

          def pod_labels(d):
              if d["kind"] == "CronJob":
                  return d["spec"]["jobTemplate"]["spec"]["template"]["metadata"].get("labels", {})
              return d["spec"]["template"]["metadata"].get("labels", {})

          workloads = [pod_labels(d) for d in pods + cronjobs]
          assert policies, "networkPolicy.enabled=true rendered no NetworkPolicy"
          assert workloads, "no workloads rendered to check selectors against"

          def matches(sel, labels):
              for k, v in (sel.get("matchLabels") or {}).items():
                  if labels.get(k) != v:
                      return False
              for e in (sel.get("matchExpressions") or []):
                  got = labels.get(e["key"])
                  if e["operator"] == "In" and got not in e["values"]:
                      return False
              return True

          unmatched = []
          for p in policies:
              sel = p["spec"].get("podSelector", {})
              if not sel:
                  continue  # {} is the default-deny, matches everything
              if not any(matches(sel, w) for w in workloads):
                  unmatched.append(p["metadata"]["name"])

          if unmatched:
              print("podSelector matches no workload the chart renders:", unmatched)
              sys.exit(1)
          print(f"ok: {len(policies)} policies, every podSelector matches a rendered workload")
          CHECK

      - name: Validate the standalone k8s manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 infra/k8s/

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

  # ── Container images ──────────────────────────────────────────────────────
  # Until this job existed, CI built both images and discarded them. Nothing in
  # the repository ever published one, so the chart's ghcr.io/... references
  # named images that had never been produced and a helm install could only ever
  # reach ImagePullBackOff.
  #
  # It runs on pull requests too, with push disabled. A publish job that only
  # runs after merge is one whose first execution is also its first test, and
  # the failure lands on main.
  #
  # `needs:` is kept deliberately. An image that reaches the registry without
  # passing the benchmark gate and both test suites is an image somebody can
  # deploy.
  publish-images:
    name: Build and publish container images
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend, e2e-frontend, test-backend]

    permissions:
      contents: read
      # GITHUB_TOKEN is enough for GHCR on a repository in the same account, so
      # there is no secret to create, store or rotate.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Skipped on pull requests, where nothing is pushed and a fork would
        # have no token with package scope.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- and version tags are immutable and are what a values file should
      # pin. `latest` is published as a convenience and deliberately points at
      # nothing anyone deploys: a mutable tag means a pod restart can change the
      # running version, and this system's output is clinical evidence whose
      # provenance has to be answerable.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Report what was published
        if: github.event_name != 'pull_request'
        run: |
          echo "Published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
