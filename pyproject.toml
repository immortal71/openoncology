[tool.pytest.ini_options]
asyncio_mode = "auto"
# The repo contains two distinct packages both named `ai`:
#   - top-level `ai/`   (used by ai/tests: ai.services.alphafold, ai.alphamissense)
#   - `api/ai/`         (used by the FastAPI app: `from ai.ranking import ...`,
#                        with api/ on sys.path — this is how it runs in prod)
# A single Python process can only bind the name `ai` to one of them, so the two
# test suites cannot share one interpreter. CI runs them as separate pytest
# invocations (see .github/workflows/ci.yml): `api/tests` gets api/ on the path
# via its conftest (sys.path.insert(0, ..)); `ai/tests` runs from the repo root
# where the top-level `ai/` wins.
#
# `--import-mode=importlib` imports each test module by file path instead of
# deriving a dotted package name from its location. Without it, collecting
# `ai/tests/*` under the default "prepend" mode fails with
# `ModuleNotFoundError: No module named 'ai.tests'`. pytest 8.2 has no
# `import_mode` ini key, so it is passed via addopts, which that version honors.
addopts = "--import-mode=importlib"
# Bare `pytest` (no path args) defaults to the api suite only, so it can never
# accidentally pull both `ai` packages into one process. Run the ai suite
# explicitly: `pytest ai/tests/` (see the Makefile and CONTRIBUTING.md).
testpaths = ["api/tests"]

[tool.coverage.run]
# Without this, `--cov=api --cov=ai` measures api/tests/ and ai/tests/ as well as
# the code under test. A test file is ~100% covered by the act of running it, so
# the 34 test modules were reporting near-100% and pulling the headline number up
# with them:
#
#     api/tests/test_oncokb_evidence.py    376 stmts    0 miss    100%
#     api/tests/test_sample_qc.py           75 stmts    0 miss    100%
#
# The gap is not small. On the same coverage data, 13,118 statements including
# tests reads 70%, while the 8,327 statements of production code read 52%. A
# threshold set against the first number cannot detect a regression in the second,
# which is the only one that means anything.
omit = [
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
# Single source of truth for the backend coverage gate. The Makefile and
# .github/workflows/ci.yml used to carry the number themselves and drifted apart
# (62 in one, 63 in the other), so a local `make test-backend` passed what CI
# rejected. Neither now passes --cov-fail-under on the ai-suite invocation; they
# inherit this value. The api-suite invocation still passes an explicit
# --cov-fail-under=0, because coverage is only complete after the second run.
#
# The number this gate measures changed, so read the sequence before reading 52
# as a regression:
#
#   63 gate / 67 reported    counted api/tests and ai/tests themselves
#   69 gate / 70 reported    same measurement, tightened
#   52 gate / 54 reported    production code only
#
# [tool.coverage.run] above omits */tests/* from coverage. A test module is
# ~100% covered by the act of running it, and 34 of them were being averaged
# into the headline. On identical coverage data the same suite reads 70% with
# tests counted and 53.93% without. Coverage did not fall by 17 points; the
# earlier figures were partly measuring the tests.
#
# 53.93% over 8,353 production statements, 844 api + 42 ai tests passing. Gate
# at 52 leaves about a point, which is the spread observed between the CI runner
# and a local Windows run.
fail_under = 52
