apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openoncology.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoncology.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.api.env.ENVIRONMENT | quote }}
  KEYCLOAK_URL: {{ printf "https://%s" .Values.ingress.hosts.keycloak | quote }}
  KEYCLOAK_REALM: {{ .Values.api.env.KEYCLOAK_REALM | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.api.env.KEYCLOAK_CLIENT_ID | quote }}
  # The API refuses to start in production without this. KEYCLOAK_URL above is
  # already the public ingress hostname, so the derived issuer is correct here
  # and KEYCLOAK_ISSUER is left unset; it is needed only where the API dials an
  # internal Service address instead.
  KEYCLOAK_AUDIENCE: {{ .Values.api.env.KEYCLOAK_AUDIENCE | quote }}
  MINIO_ENDPOINT: {{ include "openoncology.minioEndpoint" . | quote }}
  MINIO_SECURE: {{ .Values.api.env.MINIO_SECURE | quote }}
  MINIO_BUCKET_RAW: {{ .Values.api.env.MINIO_BUCKET_RAW | quote }}
  MINIO_BUCKET_VCF: {{ .Values.api.env.MINIO_BUCKET_VCF | quote }}
  MINIO_BUCKET_REPORTS: {{ .Values.api.env.MINIO_BUCKET_REPORTS | quote }}
  # DATABASE_URL is deliberately NOT here. It embeds $(DB_PASSWORD), and
  # Kubernetes does not expand $(VAR) in ConfigMap keys consumed through
  # `envFrom` — only in a container's own `env` entries. From here it reached
  # every pod as the literal seven characters, and Postgres rejected the lot.
  # It is built in the `env` block of api.yaml, workers.yaml, beat.yaml and
  # migrate-job.yaml, immediately after the DB_PASSWORD entry it refers to.
  REDIS_URL: {{ include "openoncology.redisUrl" . | quote }}
  # Next.js public vars
  NEXT_PUBLIC_API_URL: {{ printf "https://%s" .Values.ingress.hosts.api | quote }}
  NEXT_PUBLIC_KEYCLOAK_URL: {{ printf "https://%s" .Values.ingress.hosts.keycloak | quote }}
  NEXT_PUBLIC_KEYCLOAK_REALM: {{ .Values.web.env.NEXT_PUBLIC_KEYCLOAK_REALM | quote }}
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: {{ .Values.web.env.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID | quote }}
