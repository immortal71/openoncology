{{/*
Celery Beat — the scheduler behind `beat_schedule` in api/workers/__init__.py.

Two tasks depend on it: `gdpr-enforce-retention-daily`, which deletes patient
data past its retention window, and `sweep-stale-submissions-hourly`, which
recovers submissions left in `processing` by a crashed pipeline. Neither has a
non-scheduled trigger, so without this Deployment neither has ever run in the
cluster.

Single replica, Recreate strategy. Beat holds no lock; a second instance
enqueues the same schedule again, and two retention passes would run concurrent
deletions over the same rows.
*/}}
{{- if .Values.beat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoncology.fullname" . }}-beat
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openoncology.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openoncology.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "openoncology.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "openoncology.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.beat.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: beat
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # The schedule file is state beat writes on every tick. The root
          # filesystem is read-only, so it is pointed at the tmp emptyDir; losing
          # it on restart re-runs a missed cron entry at worst, which both tasks
          # tolerate.
          command:
            - celery
            - -A
            - workers
            - beat
            - --loglevel=info
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: {{ include "openoncology.fullname" . }}-config
            - secretRef:
                name: {{ .Values.api.secretRef }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openoncology-pg-secret
                  key: password
            # Assembled here rather than in the ConfigMap, and it has to stay
            # here. Kubernetes expands $(VAR) in `env` values and in a
            # container's command and args, and NOWHERE ELSE — a ConfigMap key
            # consumed through `envFrom` is passed through byte for byte.
            #
            # DATABASE_URL lived in the ConfigMap with $(DB_PASSWORD) in it, so
            # every pod in the cluster received that text as its literal
            # password and Postgres refused all of them. The API's readiness
            # probe reported it (/ready round-trips the database), and nothing
            # else did: helm lint, kubeconform and the rendered-output checks
            # all pass on a string that is only wrong once something tries to
            # connect with it.
            #
            # DB_PASSWORD must be declared before this entry. Expansion resolves
            # against the variables already defined in the list, in order.
            - name: DATABASE_URL
              value: {{ include "openoncology.databaseUrl" . | quote }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
