{{/* Celery Worker Deployments — genomic, ai, notify */}}
{{- $root := . }}
{{- range $name, $cfg := .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoncology.fullname" $root }}-worker-{{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "openoncology.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $name }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      {{- include "openoncology.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: worker-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "openoncology.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: worker-{{ $name }}
    spec:
      serviceAccountName: {{ include "openoncology.serviceAccountName" $root }}
      # SIGTERM is a warm shutdown for Celery: the worker stops taking new
      # messages and finishes the one in hand. That only helps if Kubernetes
      # waits for it. At the 30-second default a genomic task is SIGKILLed
      # mid-run on every deploy, leaving the submission stuck in `processing`
      # with nothing to retry it, so the grace period is set from how long the
      # queue's longest task actually takes.
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: "{{ $root.Values.api.image.repository }}:{{ $root.Values.api.image.tag }}"
          imagePullPolicy: {{ $root.Values.api.image.pullPolicy }}
          command:
            - celery
            - -A
            - workers.{{ $name }}_worker
            - worker
            - --loglevel=info
            - -Q
            - {{ $name }}
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: {{ include "openoncology.fullname" $root }}-config
            - secretRef:
                name: {{ $root.Values.api.secretRef }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openoncology-pg-secret
                  key: password
            # Assembled here rather than in the ConfigMap, and it has to stay
            # here. Kubernetes expands $(VAR) in `env` values and in a
            # container's command and args, and NOWHERE ELSE — a ConfigMap key
            # consumed through `envFrom` is passed through byte for byte.
            #
            # DATABASE_URL lived in the ConfigMap with $(DB_PASSWORD) in it, so
            # every pod in the cluster received that text as its literal
            # password and Postgres refused all of them. The API's readiness
            # probe reported it (/ready round-trips the database), and nothing
            # else did: helm lint, kubeconform and the rendered-output checks
            # all pass on a string that is only wrong once something tries to
            # connect with it.
            #
            # DB_PASSWORD must be declared before this entry. Expansion resolves
            # against the variables already defined in the list, in order.
            - name: DATABASE_URL
              value: {{ include "openoncology.databaseUrl" $root | quote }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
