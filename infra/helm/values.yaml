# ─────────────────────────────────────────────────────────────────────────────
# OpenOncology Helm Values — base (development / staging)
# Override with values.production.yaml for production deployments.
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: openoncology

# ── API (FastAPI) ─────────────────────────────────────────────────────────────
api:
  image:
    repository: ghcr.io/openoncology/api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  # preStop holds the container open while endpoint removal propagates to the
  # proxies; the grace period has to exceed it plus the longest request the API
  # serves, or SIGKILL arrives while the sleep is still running.
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 10
  # Voluntary disruptions — node drains, cluster upgrades — are not covered by
  # the Deployment's maxUnavailable, which only governs rollouts.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    ENVIRONMENT: production
    KEYCLOAK_REALM: openoncology
    KEYCLOAK_CLIENT_ID: openoncology-api
    # Must match what the client's audience mapper emits. Keycloak puts the
    # client id in `azp` and "account" in `aud` unless a mapper says otherwise,
    # so this value is a claim someone has to configure the realm to produce —
    # it is not automatic, and the API will not boot in production without it.
    KEYCLOAK_AUDIENCE: openoncology-api
    MINIO_SECURE: "true"
    MINIO_BUCKET_RAW: openoncology-raw
    MINIO_BUCKET_VCF: openoncology-vcf
    MINIO_BUCKET_REPORTS: openoncology-reports
  # Sensitive values provided via external Secrets (ExternalSecret / sealed-secret)
  secretRef: openoncology-api-secrets

# ── Web (Next.js) ─────────────────────────────────────────────────────────────
web:
  image:
    repository: ghcr.io/openoncology/web
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    NEXT_PUBLIC_KEYCLOAK_REALM: openoncology
    NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: openoncology-web

# ── Celery Workers ────────────────────────────────────────────────────────────
# One entry per Celery queue. The key is the queue name and the worker module
# both — `workers.<key>_worker`, consuming `-Q <key>` — so a queue that
# `task_routes` in api/workers/__init__.py sends work to and that has no entry
# here has no consumer in the cluster. Messages then accumulate in Redis and are
# never executed, which is silent: the producer's `apply_async` succeeds.
# `api/tests/test_celery_queue_coverage.py` fails the build on that mismatch.
#
# terminationGracePeriodSeconds is per queue because SIGTERM is a warm shutdown
# for Celery — stop consuming, finish the task in hand — and the wait each queue
# needs is the length of its longest task. Tasks are `acks_late`, so one killed
# at the deadline is redelivered rather than lost; it restarts from the
# beginning, and any side effect it had already performed happens twice.
workers:
  genomic:
    replicaCount: 2
    terminationGracePeriodSeconds: 900
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  ai:
    replicaCount: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"
  notify:
    replicaCount: 1
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Erasure requests and the daily retention sweep. This queue had no consumer
  # in either deployment path: `DELETE /api/me` enqueued `erase_patient_data`
  # and told the patient their data would be gone within 30 days, and the task
  # sat in Redis. Deletion is a GDPR obligation with a deadline attached, so the
  # absence of a consumer was a compliance failure that looked like a success
  # from every side that could observe it.
  gdpr:
    replicaCount: 1
    terminationGracePeriodSeconds: 300
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# ── Celery Beat (periodic tasks) ──────────────────────────────────────────────
# The scheduler for `beat_schedule`: GDPR retention enforcement daily, and the
# hourly sweep that recovers submissions stuck in `processing` after a pipeline
# crash. docker-compose has run it since the beginning; the chart never did, so
# in Kubernetes neither periodic task had ever fired.
#
# Exactly one replica, and Recreate rather than RollingUpdate. Two beats against
# one schedule enqueue every task twice, which for the retention sweep means
# two concurrent deletion passes over the same rows.
beat:
  enabled: true
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ── Prometheus exporters ──────────────────────────────────────────────────────
# infra/prometheus.yml declared scrape jobs for these and nothing deployed them,
# so each reported `up == 0` permanently. See OO-16.
#
# The redis one carries the queue depths. Celery queues are Redis lists named
# after the queue, so `redis_key_size{key="gdpr"}` is how many erasure requests
# are waiting. That is the metric worth having.
exporters:
  enabled: true
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  instances:
    redis:
      enabled: true
      port: 9121
      image:
        repository: oliver006/redis_exporter
        tag: v1.62.0
      env:
        REDIS_ADDR: "redis://{{ .Release.Name }}-redis-master:6379"
        # One entry per Celery queue in api/workers/__init__.py task_routes.
        # A queue absent here has no depth metric and cannot be alerted on.
        REDIS_EXPORTER_CHECK_KEYS: "genomic,ai,notify,gdpr"
    celery:
      enabled: true
      port: 9808
      image:
        repository: danihodovic/celery-exporter
        tag: 0.10.5
      env:
        CE_BROKER_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
        CE_ACCEPT_CONTENT: '["json"]'
    postgres:
      enabled: true
      port: 9187
      image:
        repository: prometheuscommunity/postgres-exporter
        tag: v0.15.0
      env:
        DATA_SOURCE_URI: "{{ .Release.Name }}-postgresql:5432/openoncology?sslmode=disable"
        DATA_SOURCE_USER: openoncology
        # The degraded-evidence query lives in templates/exporter-queries.yaml.
        # It is read from the database rather than counted in the worker,
        # because the worker's counter is a module global in a process nothing
        # scrapes, and it resets on restart. See OO-17.
        PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
      queriesConfigMap: true
      secretEnv:
        DATA_SOURCE_PASS:
          secret: openoncology-pg-secret
          key: password

# ── Network policies ──────────────────────────────────────────────────────────
# Default deny plus explicit allows. infra/k8s/namespace.yaml has carried these
# since the beginning; the chart, which is what production deploys from, had
# none.
#
# OFF by default, and that is not timidity. A NetworkPolicy fails closed, nothing
# in this repository can test one against a real cluster, and the sub-chart pod
# labels below vary by sub-chart version. A wrong selector denies the database
# and renders perfectly. Enable it while watching, not on a Friday.
#
# Before enabling, check the datastore selectors against
# `kubectl get pod -n openoncology --show-labels`. Bitnami has changed these
# between chart majors.
networkPolicy:
  enabled: false
  # Namespace labels, not names. Most clusters set
  # kubernetes.io/metadata.name automatically; some do not.
  dnsNamespace: kube-system
  ingressNamespace: ingress-nginx
  # Where Prometheus runs. It scrapes the exporters, so under default-deny it
  # needs ingress permission to reach them.
  monitoringNamespace: monitoring
  datastores:
    # The Bitnami postgresql sub-chart, which is the APPLICATION database.
    # Not `component: postgres`, which is the chart-local StatefulSet that
    # belongs to Keycloak.
    postgresql:
      app.kubernetes.io/name: postgresql
    redis:
      app.kubernetes.io/name: redis
    # templates/minio.yaml labels its pods with the chart's selectorLabels plus
    # component: minio, so `name` is the chart name and NOT "minio". Selecting
    # on name here matched nothing, which under default-deny denies the API its
    # object storage while rendering perfectly.
    objectStore:
      app.kubernetes.io/component: minio

# ── Database backup ───────────────────────────────────────────────────────────
# Nothing backed the application database up before this existed, and
# HIPAA_COMPLIANCE.md claimed otherwise. Persistence is not backup: losing the
# PVC, a failed migration or corruption took every submission and result with it.
#
# Enabled by default. A backup that has to be switched on is one that is off in
# the deployment that needed it, and the failure is only discovered during a
# recovery. It requires `objectStore.credentialsSecret` to exist; if it does not,
# the CronJob fails visibly rather than skipping quietly.
backup:
  enabled: true
  # 02:00 UTC, before the 03:00 GDPR retention sweep in beat_schedule, so a day's
  # backup captures the rows that sweep is about to delete.
  schedule: "0 2 * * *"
  retentionDays: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  # A run skipped because the controller was down leaves no trace otherwise.
  startingDeadlineSeconds: 3600
  image:
    # Carries both pg_dump and mc. Pin to a digest before relying on this.
    repository: bitnami/postgresql
    tag: "16"
    pullPolicy: IfNotPresent
  objectStore:
    bucket: openoncology-backups
    # An `MC_HOST_store` alias URL, e.g. https://KEY:SECRET@minio.example:9000
    credentialsSecret: openoncology-backup-secrets
    credentialsKey: mc-host-url
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── PostgreSQL (Bitnami sub-chart) ────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: openoncology
    database: openoncology
    existingSecret: openoncology-pg-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# ── Redis (Bitnami sub-chart) ─────────────────────────────────────────────────
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# ── MinIO ─────────────────────────────────────────────────────────────────────
minio:
  # Deployed by this chart when true. Before templates/minio.yaml existed this
  # block configured an image and a volume for something nothing created, and
  # the application was pointed at it regardless. See OO-18.
  enabled: true
  # Set this and enabled: false to use an external object store, e.g. S3.
  externalEndpoint: ""
  image:
    repository: minio/minio
    # Pinned rather than `latest`, which was what this said. An object store
    # that changes version on a pod restart is not a store you can reason about.
    tag: RELEASE.2024-06-13T22-53-53Z
    pullPolicy: IfNotPresent
  persistence:
    size: 200Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  # Must carry MINIO_ROOT_USER and MINIO_ROOT_PASSWORD, matching the
  # MINIO_ACCESS_KEY and MINIO_SECRET_KEY the API reads from its own secret.
  secretRef: openoncology-minio-secrets

# ── Keycloak's database ───────────────────────────────────────────────────────
# This chart runs TWO PostgreSQL instances and they are easy to confuse.
#
#   {release}-postgresql            the Bitnami sub-chart. The APPLICATION
#                                   database: submissions, mutations, results.
#                                   Configured under `postgresql:` below.
#   {release}-openoncology-postgres templates/postgres.yaml. KEYCLOAK's
#                                   database: users, clients, the realm.
#                                   Configured here.
#
# Until now the second read `postgresql.primary.persistence.size` and
# `postgresql.primary.resources`, which belong to the first. In production that
# gave a realm database holding a few megabytes a 200Gi volume, and meant
# resizing the application database silently resized Keycloak's. See OO-9.
#
# IMPORTANT for existing deployments. `volumeClaimTemplates` is immutable on a
# StatefulSet, so `helm upgrade` will reject a changed size against a cluster
# where this already exists. Applying it needs a fresh install, or deleting the
# StatefulSet with `--cascade=orphan` and recreating it. Do not attempt that
# without a backup of the realm; `docs/RUNBOOK_BACKUP_RESTORE.md` records that
# this database is not covered by the nightly dump.
keycloakDatabase:
  persistence:
    # Proportionate to what it holds. Keycloak's schema is users, clients,
    # sessions and the realm, not patient data.
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── Keycloak ──────────────────────────────────────────────────────────────────
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
  replicaCount: 1
  secretRef: openoncology-keycloak-secrets

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # The API host routes `/` as a Prefix, so every path on the pod is public,
    # /metrics included. It carries no authentication and publishes per-handler
    # request counts and latencies — traffic shape for a service whose traffic
    # is patients submitting tumour genomes.
    #
    # Prometheus is unaffected: infra/prometheus.yml scrapes `api:8000`
    # in-cluster and the ServiceMonitor scrapes the Service, neither through
    # this ingress.
    #
    # One caveat worth knowing rather than assuming away: ingress-nginx ships
    # `allow-snippet-annotations: false` since 1.9, and where it is false the
    # controller ignores this annotation instead of rejecting it. That fails
    # open. Confirm the rendered nginx.conf actually contains the location block
    # before treating the endpoint as closed.
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics {
        deny all;
        return 403;
      }
  hosts:
    api: api.openoncology.org
    web: openoncology.org
    keycloak: auth.openoncology.org
  tls:
    enabled: true
    secretName: openoncology-tls

# ── Prometheus / Grafana ──────────────────────────────────────────────────────
monitoring:
  enabled: true
  serviceMonitor: true

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: openoncology
  annotations: {}
