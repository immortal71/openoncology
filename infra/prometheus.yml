global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Set to the Alertmanager reachable from this Prometheus. Left unset here
# because the address differs per environment and a wrong one fails silently:
# rules evaluate, alerts fire, and nothing receives them. Whoever deploys this
# has to fill it in, and OO-13's acceptance criteria require observing a rule
# actually reach a receiver rather than merely evaluating.
alerting:
  alertmanagers: []
    # - static_configs:
    #     - targets: ["alertmanager:9093"]

rule_files:
  - alerts/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: openoncology-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # These were commented out in #140 because nothing deployed them and each
  # reported `up == 0` permanently. The exporters exist now (OO-16), so the jobs
  # are live again. `api/tests/test_alert_rules.py` fails if a scrape job names a
  # host no deployment defines, which is what keeps this honest.
  #
  # Names match the Helm Services. docker-compose uses the same short names.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: postgres
    static_configs:
      - targets: ["db-exporter:9187"]
