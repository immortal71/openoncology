apiVersion: v1
kind: ConfigMap
metadata:
  name: openoncology-config
  namespace: openoncology
data:
  ENVIRONMENT: "production"
  # DATABASE_URL is NOT here. It embeds $(DB_PASSWORD), and Kubernetes expands
  # $(VAR) only in a container's own `env` entries and in its command and args —
  # never in a ConfigMap key read through `envFrom`. From here it arrived at the
  # API as those seven literal characters and Postgres rejected every
  # connection. It is assembled in deployment.yaml's `env` block instead.
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT: "storage:9000"
  MINIO_SECURE: "false"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "openoncology"
  KEYCLOAK_CLIENT_ID: "openoncology-api"
  BUCKET_RAW: "openoncology-raw"
  BUCKET_VCF: "openoncology-vcf"
  BUCKET_REPORTS: "openoncology-reports"
