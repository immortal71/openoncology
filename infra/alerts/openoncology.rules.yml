# Alerting rules for OpenOncology.
#
# BACKLOG.md OO-13. Before this file existed, infra/prometheus.yml set
# `rule_files: []` and `alertmanagers: []`, so every metric was scraped and no
# alert could ever fire.
#
# Every rule here is written against a metric that is genuinely exported:
# `up` and `scrape_*` come from Prometheus itself, and the `http_*` series come
# from prometheus_fastapi_instrumentator's default set, which api/main.py
# installs. `api/tests/test_alert_rules.py` fails the build if a rule references
# anything outside that set, because an alert on a metric nobody emits is
# indistinguishable from no alert at all.
#
# Two things deliberately have no rule yet, and both are filed rather than
# faked:
#
#   * Celery queue depth and task age. No exporter emits them. See OO-16.
#   * The degraded-evidence condition. `settings.degraded_evidence_alert_after`
#     escalates a log line to ERROR and emits no metric, so there is nothing to
#     alert on from here. See OO-17.

groups:
  - name: openoncology-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is not responding"
          description: >-
            {{ $labels.job }} at {{ $labels.instance }} has failed every scrape
            for five minutes. For the api job this means the service is
            unreachable, not merely unhealthy: /ready is excluded from
            instrumentation, so a pod that is up but degraded still scrapes
            successfully and will not trigger this.

      - alert: PrometheusScrapesNothing
        expr: count(up == 1) < 2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Fewer than two Prometheus targets are up"
          description: >-
            Prometheus scrapes itself, so a healthy deployment has at least
            Prometheus and the API. One target means only Prometheus is
            answering and monitoring is effectively blind.

  - name: openoncology-api
    rules:
      - alert: ApiErrorRateHigh
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of API responses are server errors"
          description: >-
            Sustained 5xx rate above five percent for ten minutes. The
            denominator is clamped so an idle service cannot divide by zero and
            produce a spurious alert.

      - alert: ApiLatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[10m])) by (le)
          ) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API 95th percentile latency above 5 seconds"
          description: >-
            Submission and results endpoints do real work, so this is set well
            above a typical web threshold. It is meant to catch a stuck
            dependency rather than ordinary load.

      - alert: ApiServingNoTraffic
        expr: sum(rate(http_requests_total[30m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "API has served no requests for 30 minutes"
          description: >-
            Expected to be noisy on a low-traffic or research deployment. Route
            it to a low-priority receiver or silence it there rather than
            deleting it, because on a deployment that should have traffic it is
            the only rule here that catches an ingress or DNS failure in front
            of a healthy pod.

  - name: openoncology-queues
    rules:
      # Celery queues are Redis lists named after the queue, so the key size is
      # the number of messages waiting. OO-16 deployed the exporter that
      # measures this; before it, a stalled queue was invisible.
      - alert: GdprQueueNotDraining
        expr: redis_key_size{key="gdpr"} > 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Erasure requests have been waiting over two hours"
          description: >-
            The gdpr queue carries right-to-erasure requests and the daily
            retention sweep. Work sitting here means deletions are not being
            performed, which is an obligation with a 30 day deadline rather than
            a backlog. This queue is normally empty, so any sustained depth is
            worth waking someone for. That it had no consumer at all until #130
            is the reason this alert exists.

      - alert: GenomicQueueBacklog
        expr: redis_key_size{key="genomic"} > 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Genomic queue has held over 20 submissions for an hour"
          description: >-
            Either throughput is insufficient or the workers have stopped
            consuming. Check `celery_worker_up` before scaling: a queue that is
            deep because nothing is consuming does not improve with more
            capacity.

      - alert: CeleryWorkersAbsent
        expr: sum(celery_worker_up) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No Celery worker is reporting"
          description: >-
            Nothing is processing submissions, erasures or notifications. Task
            events must be enabled for this to be meaningful; they are set in
            api/workers/__init__.py, and if that changes this alert goes quiet
            rather than firing.

      - alert: CeleryTaskFailureRateHigh
        expr: >-
          sum(rate(celery_task_failed_total[15m]))
          / clamp_min(sum(rate(celery_task_received_total[15m])), 0.001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Over 20% of Celery tasks are failing"
          description: >-
            Tasks are acks_late, so failures are redelivered and a persistent
            failure becomes a redelivery loop that looks like throughput.

  - name: openoncology-datastores
    rules:
      - alert: PostgresConnectionsNearLimit
        expr: >-
          sum(pg_stat_activity_count)
          / clamp_min(sum(pg_settings_max_connections), 1) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections above 80% of max"
          description: >-
            The API and every worker share one pool. Exhaustion presents as
            unrelated timeouts across all of them at once rather than as a
            database alert.

      - alert: RedisDown
        expr: redis_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is not responding to the exporter"
          description: >-
            Redis is the Celery broker. While it is down nothing is queued or
            consumed, and submissions accepted by the API go nowhere.
